[workspace]
version = "0.1.0"
platforms = ["win-64"]
channels = [
    "https://prefix.dev/robostack-jazzy",
    "https://prefix.dev/conda-forge",
]

[dependencies]
python = ">=3.12,<3.13"
ros-jazzy-turtlesim = ">=1.8.3,<2"
ros-jazzy-desktop = ">=0.11.0,<0.12"
compilers = ">=1.11.0,<2"
cmake = "3.31.*"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
ninja = ">=1.13.2,<2"
rosdep = ">=0.26.0,<0.27"
colcon-common-extensions = ">=0.3.0,<0.4"
opencv = ">=4.12.0,<5"
ros-jazzy-ros2cli = ">=0.32.8,<0.33"
ros-jazzy-ros2pkg = ">=0.32.8,<0.33"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
numpy = "*"
ca-certificates = ">=2026.7.22,<2027"
pyside6 = ">=6.11.2,<7"
pynput = ">=1.8.2,<2"


[pypi-dependencies]
requests = ">=2.34.2, <3"
adbutils = ">=2.12.0, <3"
pyserial = ">=3.5, <4"
console = { path = ".", editable = true }
pyside6 = ">=6.11.2, <7"
pynput = ">=1.8.2,<2"

[tasks]
test = "python src/testing/publisher.py"
joy = "python src/testing/joy_test.py"
